<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>零食樂園 Snack Paradise | 零食</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">

<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-container">
                <img src="images/logo.png" alt="零食樂園 Logo" onerror="this.src='https://via.placeholder.com/50'">
                <span class="logo-text">Snack Paradise</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">首頁</a></li>
                    <li><a href="about.html">公司簡介</a></li>
                    <li><a href="snacks.html" class="active">零食</a></li>
                    <li><a href="candies.html">糖果</a></li>
                    <li><a href="toys.html">玩具</a></li>
                    <li><a href="others.html">其它類</a></li>
                    <li><a href="contact.html">聯絡我們</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="page-container animate-in"><h2>零食區</h2></div>
        <section class="products-grid animate-in">
            <div class="product-card">
                <span class="category-tag">零食</span>
                <img src="images/snack_chips.png" alt="特級洋芋片" class="product-image" onerror="this.src='https://via.placeholder.com/200'">

                <div class="product-price">$50</div>
                <a href="product1.html" class="btn">查看詳情</a>
            </div>
            <div class="product-card">
                <span class="category-tag">零食</span>
                <img src="images/snack_popcorn.png" alt="焦糖爆米花" class="product-image" onerror="this.src='https://via.placeholder.com/200'">

                <div class="product-price">$65</div>
                <a href="product2.html" class="btn">查看詳情</a>
            </div>
            <div class="product-card">
                <span class="category-tag">零食</span>
                <img src="images/snack_pretzels.png" alt="香脆蝴蝶餅" class="product-image" onerror="this.src='https://via.placeholder.com/200'">

                <div class="product-price">$40</div>
                <a href="product3.html" class="btn">查看詳情</a>
            </div>
            <div class="product-card">
                <span class="category-tag">零食</span>
                <img src="images/snack_nuts.png" alt="綜合堅果罐" class="product-image" onerror="this.src='https://via.placeholder.com/200'">
                <h3 class="product-title">綜合堅果罐</h3>
                <div class="product-price">$150</div>
                <a href="product4.html" class="btn">查看詳情</a>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 零食樂園 Snack Paradise. 保留所有權利。</p>
    </footer>
