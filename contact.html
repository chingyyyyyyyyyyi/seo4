<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>零食樂園 Snack Paradise | 聯絡我們</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-container">
                <img src="images/logo.png" alt="零食樂園 Logo" onerror="this.src='https://via.placeholder.com/50'">
                <span class="logo-text">Snack Paradise</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">首頁</a></li>
                    <li><a href="about.html">公司簡介</a></li>
                    <li><a href="snacks.html">零食</a></li>
                    <li><a href="candies.html">糖果</a></li>
                    <li><a href="toys.html">玩具</a></li>
                    <li><a href="others.html">其它類</a></li>
                    <li><a href="contact.html" class="active">聯絡我們</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="page-container animate-in">
            <h2>聯絡我們</h2>
            <form class="contact-form" action="#" method="POST">
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" name="name" required placeholder="請輸入您的姓名">
                </div>
                <div class="form-group">
                    <label for="email">電子郵件</label>
                    <input type="email" id="email" name="email" required placeholder="請輸入您的電子信箱">
                </div>
                <div class="form-group">
                    <label for="message">訊息內容</label>
                    <textarea id="message" name="message" rows="5" required placeholder="請輸入您的問題或建議"></textarea>
                </div>
                <button type="button" class="btn" onclick="alert('感謝您的來信，我們將盡快回覆！')">送出訊息</button>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 零食樂園 Snack Paradise. 保留所有權利。</p>
    </footer>
</body>
</html>
