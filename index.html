<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>零食樂園 Snack Paradise | 最棒的休閒食品</title>
    <meta name="description" content="零食樂園提供最新鮮、最多樣的零食、糖果、玩具等休閒產品，滿足您的所有需求。">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-container">
                <img src="images/logo.png" alt="零食樂園 Logo" id="logo-img">
                <span class="logo-text">Snack Paradise</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html" class="active">首頁</a></li>
                    <li><a href="about.html">公司簡介</a></li>
                    <li><a href="snacks.html">零食</a></li>
                    <li><a href="candies.html">糖果</a></li>
                    <li><a href="toys.html">玩具</a></li>
                    <li><a href="others.html">其它類</a></li>
                    <li><a href="contact.html">聯絡我們</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero animate-in">
            <div class="hero-content">
                <h1>發現您的<br><span>快樂滋味</span></h1>
                <p>我們提供全球最受歡迎的零食、精美糖果與趣味玩具。立刻探索我們的精選商品，讓每一天都充滿驚喜！</p>
                <a href="snacks.html" class="btn">立即選購</a>
            </div>
            <div class="hero-image">
                <img src="images/snack_chips.png" alt="洋芋片" onerror="this.src='https://via.placeholder.com/200'">
                <img src="images/candy_gummy.png" alt="小熊軟糖" onerror="this.src='https://via.placeholder.com/200'">
                <img src="images/toy_yoyo.png" alt="溜溜球" onerror="this.src='https://via.placeholder.com/200'">
                <img src="images/snack_popcorn.png" alt="爆米花" onerror="this.src='https://via.placeholder.com/200'">
            </div>
        </section>

        <h2 class="section-title">熱門精選商品</h2>
        <section class="products-grid">
            <!-- 產品卡片將由 JavaScript 動態生成，或直接寫死，這裡是首頁預覽 -->
            <div class="product-card">
                <span class="category-tag">零食</span>
                <img src="images/snack_chips.png" alt="特級洋芋片" class="product-image" onerror="this.src='https://via.placeholder.com/200'">
                <h3 class="product-title">特級洋芋片</h3>
                <div class="product-price">$50</div>
                <a href="product1.html" class="btn">查看詳情</a>
            </div>
            <div class="product-card">
                <span class="category-tag">糖果</span>
                <img src="images/candy_gummy.png" alt="彩虹小熊軟糖" class="product-image" onerror="this.src='https://via.placeholder.com/200'">
                <h3 class="product-title">彩虹小熊軟糖</h3>
                <div class="product-price">$45</div>
                <a href="product5.html" class="btn">查看詳情</a>
            </div>
            <div class="product-card">
                <span class="category-tag">玩具</span>
                <img src="images/toy_yoyo.png" alt="炫光溜溜球" class="product-image" onerror="this.src='https://via.placeholder.com/200'">
                <h3 class="product-title">炫光溜溜球</h3>
                <div class="product-price">$120</div>
                <a href="product9.html" class="btn">查看詳情</a>
            </div>
            <div class="product-card">
                <span class="category-tag">其它</span>
                <img src="images/other_soda.png" alt="清涼氣泡水" class="product-image" onerror="this.src='https://via.placeholder.com/200'">
                <h3 class="product-title">清涼氣泡水</h3>
                <div class="product-price">$35</div>
                <a href="product13.html" class="btn">查看詳情</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 零食樂園 Snack Paradise. 保留所有權利。</p>
    </footer>
</body>
</html>
